        .loading-container {

        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #d64d7a;
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        .loading-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1a1a;
            min-height: 2rem;
        }
        .loading-percentage {
            font-size: 2.5rem;
            font-weight: 700;
            color: #d64d7a;
            margin-bottom: 1rem;
        }
    </style>

    <header class="hdr">

    <main class="step5-container" style="padding: 4rem 1rem;">
        <div class="loading-container">
            <h1 class="step5-title" style="margin-bottom: 2rem;">Construyendo tu plan...</h1>
            
            <div class="carousel-wrapper">
                <div class="carousel-track" id="carousel">
                    <div class="carousel-slide"><img src="../images/transformation-1.webp" alt="Transformação 1"></div>
                    <div class="carousel-slide"><img src="../images/transformation-2.webp" alt="Transformação 2"></div>
                    <div class="carousel-slide"><img src="../images/transformation-3.webp" alt="Transformação 3"></div>
                </div>
            </div>
            
            <div class="loading-percentage" id="percentage">0%</div>
            
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            
            <div class="loading-text" id="loading-text">Analizando tus respuestas...</div>
        </div>
    </main>

    <script>
        const totalTime = 9000; // 9 seconds
        const updateInterval = 50; // update every 50ms
        let currentTime = 0;
        
        const progressBar = document.getElementById('progress-fill');
        const percentageText = document.getElementById('percentage');
        const loadingText = document.getElementById('loading-text');
        const carousel = document.getElementById('carousel');
        
        const texts = [
            "Analizando tus respuestas...",
            "Calculando tu IMC actual...",
            "Evaluando perfil metabólico...",
            "Seleccionando ejercicios...",
            "Finalizando tu plan personalizado..."
        ];

        const interval = setInterval(() => {
            currentTime += updateInterval;
            let progress = (currentTime / totalTime) * 100;
            
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                setTimeout(() => {
                    window.location.href = 'step30.html';
                }, 500);
            }
            
            progressBar.style.width = progress + '%';
            percentageText.textContent = Math.floor(progress) + '%';
            
            // Update carousel
            if (progress < 33) {
                carousel.style.transform = 'translateX(0%)';
            } else if (progress < 66) {
                carousel.style.transform = 'translateX(-33.333%)';
            } else {
                carousel.style.transform = 'translateX(-66.666%)';
            }
            
            // Update text
            const textIndex = Math.floor((progress / 100) * texts.length);
            loadingText.textContent = texts[Math.min(textIndex, texts.length - 1)];
            
        }, updateInterval);
    </script>
