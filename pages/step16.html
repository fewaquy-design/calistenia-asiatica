    <main class="step5-container" style="max-width: 600px; padding: 4rem 1rem;">
        <h1 class="step5-title" style="margin-bottom: 2rem;">Qual é a sua altura?</h1>
        
        <div class="ruler-container">
            <div class="unit-toggle">
                <button class="unit-btn active" id="btn-cm">cm</button>
                <button class="unit-btn" id="btn-pol">pol</button>
            </div>
            
            <div class="ruler-value">
                <span id="height-val">165</span>
                <span class="ruler-unit" id="height-unit">cm</span>
            </div>
            
            <div class="scroll-ruler-wrapper">
                <div class="scroll-ruler-pointer"></div>
                <div class="scroll-ruler-area" id="ruler-scroll">
                    <div class="scroll-ruler-track" id="ruler-track"></div>
                </div>
            </div>
            
            <p class="ruler-hint">Arraste para ajustar</p>
            
            <div class="info-box">
                <div class="info-icon">i</div>
                <div class="info-text">Calculando seu IMC</div>
            </div>
            
            <a href="javascript:void(0)" onclick="saveAndNext()" class="btn-pink" style="margin-top: 1rem;">Próximo passo</a>
        </div>
    </main>

    <script>
        const track = document.getElementById('ruler-track');
        const scrollArea = document.getElementById('ruler-scroll');
        const valDisplay = document.getElementById('height-val');

        const minVal = 140;
        const maxVal = 220;
        const pixelsPerUnit = 10;
        let currentVal = 165;

        // Generate ticks
        for (let i = minVal; i <= maxVal; i++) {
            const tick = document.createElement('div');
            tick.className = 'ruler-tick';
            if (i % 10 === 0) {
                tick.classList.add('major');
                tick.setAttribute('data-val', i);
            } else if (i % 5 === 0) {
                tick.style.height = '20px';
            }
            track.appendChild(tick);
        }

        // Update value on scroll
        scrollArea.addEventListener('scroll', () => {
            let calcVal = minVal + Math.round(scrollArea.scrollLeft / pixelsPerUnit);
            if (calcVal < minVal) calcVal = minVal;
            if (calcVal > maxVal) calcVal = maxVal;
            currentVal = calcVal;
            valDisplay.textContent = currentVal;
        });

        // Set initial value
        setTimeout(() => {
            scrollArea.scrollLeft = (currentVal - minVal) * pixelsPerUnit;
        }, 50);

        // Mouse drag logic for desktop
        let isDragging = false;
        let startX, scrollLeft;
        scrollArea.addEventListener('mousedown', (e) => {
            isDragging = true;
            scrollArea.style.cursor = 'grabbing';
            startX = e.pageX - scrollArea.offsetLeft;
            scrollLeft = scrollArea.scrollLeft;
        });
        scrollArea.addEventListener('mouseleave', () => {
            isDragging = false;
            scrollArea.style.cursor = 'grab';
        });
        scrollArea.addEventListener('mouseup', () => {
            isDragging = false;
            scrollArea.style.cursor = 'grab';
        });
        scrollArea.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - scrollArea.offsetLeft;
            const walk = (x - startX) * 1.5; 
            scrollArea.scrollLeft = scrollLeft - walk;
        });

        function saveAndNext() {
            localStorage.setItem('userHeight', currentVal);
            window.location.href = 'step17.html';
        }
    </script>
